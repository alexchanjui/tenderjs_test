services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: vueAdmin_mssql
    restart: always
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${DB_PASSWORD}
    ports:
      - "1435:1433"
    volumes:
      - vueAdmin_mssql_data:/var/opt/mssql

  redis:
    image: redis:alpine
    container_name: vueAdmin_redis
    restart: always
    ports:
      - "6380:6379"
    volumes:
      - vueAdmin_redis_data:/data
    command: redis-server --appendonly yes

  app:
    image: alex46732/vueAdmin-api:${APP_VERSION}
    container_name: vueAdmin-api
    restart: always
    ports:
      - "3001:3001"
    env_file:
      - .env
    depends_on:
      - db
      - redis

volumes:
  vueAdmin_mssql_data:
  vueAdmin_redis_data:
